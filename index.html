<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Splitter</title>
<script>
  // GitHub Pages pe cross-origin isolation enable karta hai (ek baar auto reload hoga)
  if ('serviceWorker' in navigator && !window.crossOriginIsolated) {
    navigator.serviceWorker.register('coi-serviceworker.js').then(() => location.reload());
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
<style>
  body{font-family:system-ui,sans-serif;max-width:560px;margin:30px auto;padding:0 16px;background:#111;color:#eee}
  h2{margin-bottom:4px} .sub{color:#999;font-size:13px;margin-bottom:18px}
  .card{background:#1c1c1c;border-radius:12px;padding:16px;margin-bottom:14px}
  label{display:block;font-size:13px;color:#aaa;margin:10px 0 4px}
  input,select,button{width:100%;padding:10px;border-radius:8px;border:1px solid #333;background:#262626;color:#eee;font-size:15px;box-sizing:border-box}
  button{background:#4f8cff;border:0;font-weight:600;cursor:pointer;margin-top:14px}
  button:disabled{opacity:.5;cursor:not-allowed}
  .row{display:flex;gap:10px}.row>div{flex:1}
  video{width:100%;border-radius:8px;margin-top:10px}
  .part{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #2a2a2a}
  .part a{color:#4f8cff;text-decoration:none;font-weight:600}
  #msg{font-size:13px;color:#9be39b;margin-top:10px;min-height:18px}
  .warn{color:#ff9b9b !important}
</style>
</head>
<body>
<h2>Video Splitter</h2>
<div class="sub">Upload → parts + duration select karo → download. Video device se bahar nahi jaata.</div>

<div class="card">
  <input type="file" id="file" accept="video/*">
  <video id="preview" controls hidden></video>
  <div id="info" class="sub" style="margin-top:8px"></div>

  <div class="row">
    <div><label>Number of parts</label><input type="number" id="parts" min="1" value="3"></div>
    <div><label>Duration of each part (sec)</label><input type="number" id="dur" min="1" value="10"></div>
  </div>

  <label>Mode</label>
  <select id="mode">
    <option value="copy">Lossless (zero quality loss, keyframe pe cut)</option>
    <option value="exact">Exact timing (re-encode, almost lossless, slow)</option>
  </select>

  <button id="go" disabled>Split Video</button>
  <div id="msg"></div>
</div>

<div class="card" id="out" hidden>
  <div id="list"></div>
  <button id="all">Download All</button>
</div>

<script>
const { createFFmpeg, fetchFile } = FFmpeg;
const $ = id => document.getElementById(id);
const setMsg = (t, warn) => { $('msg').textContent = t; $('msg').className = warn ? 'warn' : ''; };

const ffmpeg = createFFmpeg({
  log: false,
  corePath: 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js'
});
ffmpeg.setProgress(p => setMsg(`Processing... ${Math.round((p.ratio || 0) * 100)}%`));

let file = null, duration = 0, results = [];

$('file').onchange = e => {
  file = e.target.files[0]; if (!file) return;
  const v = $('preview'); v.src = URL.createObjectURL(file); v.hidden = false;
  v.onloadedmetadata = () => {
    duration = v.duration;
    $('info').textContent = `Length: ${duration.toFixed(1)} sec`;
    $('go').disabled = false;
  };
};

$('go').onclick = async () => {
  const n = +$('parts').value, d = +$('dur').value, mode = $('mode').value;
  if (!n || !d) return setMsg('Parts aur duration sahi daalo', true);
  // Jitne parts video me fit ho sakte hain (last part chhota ho sakta hai, e.g. 28s -> 10+10+8)
  const parts = [];
  for (let i = 0; i < n; i++) {
    const start = i * d;
    const len = Math.min(d, duration - start);
    if (len < 0.2) break;
    parts.push({ start, len });
  }
  if (!parts.length) return setMsg(`Video sirf ${duration.toFixed(1)}s ka hai`, true);
  $('go').disabled = true; $('out').hidden = true; results = [];
  try {
    if (!window.crossOriginIsolated) throw new Error('Page ek baar reload karo (service worker activate ho raha hai)');
    if (!ffmpeg.isLoaded()) { setMsg('Engine load ho raha hai (first time ~25MB)...'); await ffmpeg.load(); }
    const ext = (file.name.split('.').pop() || 'mp4').toLowerCase();
    ffmpeg.FS('writeFile', 'in.' + ext, await fetchFile(file));
    for (let i = 0; i < parts.length; i++) {
      setMsg(`Part ${i+1}/${parts.length} bana raha hai...`);
      const name = `part_${i+1}.${ext}`;
      const args = ['-ss', String(parts[i].start), '-i', 'in.' + ext, '-t', String(parts[i].len)];
      if (mode === 'copy') args.push('-c', 'copy', '-avoid_negative_ts', 'make_zero');
      else args.push('-c:v', 'libx264', '-crf', '12', '-preset', 'veryfast', '-c:a', 'copy');
      args.push(name);
      await ffmpeg.run(...args);
      const data = ffmpeg.FS('readFile', name);
      ffmpeg.FS('unlink', name);
      results.push({ name, url: URL.createObjectURL(new Blob([data.buffer], { type: file.type })) });
    }
    ffmpeg.FS('unlink', 'in.' + ext);
    $('list').innerHTML = results.map(r =>
      `<div class="part"><span>${r.name}</span><a href="${r.url}" download="${r.name}">Download</a></div>`).join('');
    $('out').hidden = false;
    const sizes = parts.map(p => +p.len.toFixed(1) + 's').join(' + ');
    setMsg(`Done ✅ ${parts.length} parts (${sizes})` + (parts.length < n ? ` — video choti thi, isliye ${n} ki jagah ${parts.length} parts bane` : ''));
  } catch (err) { console.error(err); setMsg('Error: ' + err.message, true); }
  $('go').disabled = false;
};

$('all').onclick = async () => {
  for (const r of results) {
    const a = document.createElement('a'); a.href = r.url; a.download = r.name; a.click();
    await new Promise(res => setTimeout(res, 400));
  }
};
</script>
</body>
</html>
